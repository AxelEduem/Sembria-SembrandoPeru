services:
  postgres:
    image: postgres:17
    container_name: DB-Postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${DB_DATABASE:-Sembria}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD in backend/.env}

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
